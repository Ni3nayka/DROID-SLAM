/**:
  ros__parameters:
    map_path: ''
    # Empty file path selects factory CameraInfo from the camera's current profile.
    calib_path: ''
    calib_width: 0
    calib_height: 0
    image_topic: /camera/color/image_raw
    camera_info_topic: /camera/color/camera_info
    image_transport: raw
    input_rectified: false
    save_calibration_path: ''
    show_gui: true
    show_preview: true
    screenshot_path: ''
    output_dir: ''
    overwrite: false
    # Matches the actual IRS-DRIVERS RealSense publisher. BEST_EFFORT may lose
    # fragmented raw images on a transport with small receive buffers.
    qos_reliability: reliable
    check_header_age: true
    use_sim_time: false
    pixels: 196608
    features: 1800
    min_inliers: 20
    threads: 2
    matcher_threads: 2
    cache_dir: ''
    refresh_seconds: 0.3
    global_seconds: 2.0
    history_seconds: 1.0
    history_frames: 45
    max_frame_age: 0.15
    max_tracking_gap: 0.25
    verification_seconds: 3.0
    catchup_budget_ms: 25.0
    map_frame: droid_map
    # Separate from the RealSense TF tree: do not give an existing camera frame a second parent.
    camera_frame: droid_camera_optical_frame
    scale_to_meters: 0.0
    publish_tf: false
    max_frames: 0
    duration: 0.0
